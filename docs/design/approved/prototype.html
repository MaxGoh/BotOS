function libraryCards(kind='All',owner='kit'){return `<div class="library-grid">${[{title:procedure.title,owner:procedure.placement,version:procedureDraft?`v${draftVersion} draft · v${activeVersion} active`:`v${activeVersion} active`,id:'report',text:'From source material to a traceable report. Variable dates, fixed checks, clear stopping points.'},{title:'Organize a project archive',owner:'Shared library',version:'v1 active',id:'archive',text:'Organize copies, preserve originals, and ask about conflicting revisions.'},{title:'Source comparison brief',owner:'Private · Mira',version:'v1 active',id:'sources',text:'Compare primary research and record the evidence behind each claim.'}].filter(p=>kind==='All'||kind==='Shared'&&p.owner==='Shared library'||kind==='Private'&&p.owner!=='Shared library'&&(owner==='all'||p.owner.includes(getAgent(owner).name))).map(p=>`<article class="panel procedure-card"><div class="row-between">${icon('file',22)}<span class="badge">${esc(p.owner)}</span></div><h3>${esc(p.title)}</h3><p>${p.text}</p><div class="row-between"><span class="mono muted">${p.version}</span>${p.id==='report'?btn(procedureDraft?'Review draft':'Open procedure','review','btn-small','data-id="kit"'):btn('View & assign','assign','btn-small',`data-id="${p.id}"`)}</div></article>`).join('')||'<div class="empty">No private procedures yet. Save one from a teaching run.</div>'}</div>`}
function library(){return `${heading('Library / Learned, then approved','Procedures','Procedures carry instructions. Access stays with each agent.',btn('Draft a procedure','save-procedure','btn-primary'))}<div class="tabs">${['All procedures','Shared','Private'].map(t=>`<button class="tab ${libFilter===t?'active':''}" data-action="library-filter" data-id="${t}">${t}</button>`).join('')}</div>${libraryCards(libFilter==='All procedures'?'All':libFilter,'all')}<div class="notice blue mt"><strong>Active instructions ≠ action permissions.</strong>Approving a version makes its instructions reusable. Each run still uses the assigned agent’s separate permissions. Existing runs remain pinned to their approved version.</div>`}
function review(){return `${heading('Library / Version review',esc(procedure.title),'Turn a useful lesson into instructions you can trust.',btn('Back to library','library'))}<div class="review-grid"><section class="panel" data-od-id="procedure-editor"><div class="panel-head row-between"><h3>Procedure editor</h3><span class="badge">${procedureDraft?`Draft · v${draftVersion}`:`Active · v${activeVersion}`}</span></div>${[['Variable inputs','inputs'],['Fixed steps','steps'],['Rules','rules'],['Stop conditions','stops'],['Completion evidence','evidence']].map(([name,key])=>`<div class="review-section"><h3>${name}</h3><label class="muted" style="font-size:11px" for="procedure-${key}">${key==='inputs'?'These values change between runs.':key==='evidence'?'A success message alone is not evidence.':'Review the exact instructions below.'}</label><textarea id="procedure-${key}" data-procedure="${key}" ${!procedureDraft?'readonly':''} style="margin-top:8px;min-height:${key==='steps'?140:85}px">${esc(procedure[key])}</textarea></div>`).join('')}</section><aside class="stack" style="align-content:start" data-od-id="version-review"><div class="panel"><div class="panel-head"><h3>Review the revision</h3></div><div class="panel-body"><div class="row-between"><span class="version-number">${procedureDraft?`v${activeVersion} → v${draftVersion}`:`v${activeVersion}`}</span><span class="badge">${procedureDraft?'Awaiting you':'Approved'}</span></div><p class="muted" style="font-size:12px;margin-top:13px">Drafted by ${getAgent(reviewSource).name} from supervised teaching. Your edits are included in this review.</p><div class="change"><strong>+ Rule</strong><br><span id="revision-rules">${esc(procedure.rules)}</span></div><div class="change"><strong>+ Stop condition</strong><br><span id="revision-stops">${esc(procedure.stops)}</span></div><div class="change"><strong>+ Evidence</strong><br><span id="revision-evidence">${esc(procedure.evidence)}</span></div><label style="font-size:12px;margin-top:22px">Placement<select id="placement" ${!procedureDraft?'disabled':''}><option ${procedure.placement.startsWith('Private')?'selected':''}>Private · ${getAgent(reviewSource).name}</option><option ${procedure.placement==='Shared library'?'selected':''}>Shared library</option></select></label><p style="font-size:11px;color:var(--muted);margin-top:8px">Sharing does not transfer credentials, saved memory, or workstation access.</p></div></div><div class="notice blue"><strong>Only the procedure is approved.</strong>Action permissions stay unchanged. Current runs keep their pinned version; the newly approved version applies only to future runs.</div>${procedureDraft?`<label class="chip-check"><input id="review-confirm" type="checkbox">I reviewed the inputs, steps, rules, and stopping points.</label>${btn('Approve version','approve-version','btn-primary')}${btn('Save draft','save-draft')}`:`${btn('Create revision','revise','btn-primary')}${btn('Assign approved procedure','assign','', 'data-id="report"')}`}</aside></div>`}
function platformSettings(){return `${heading('Settings / The foundation','Settings','Reusable connections. Dedicated workstations. One local host.')}<div class="grid-2"><section class="panel"><header class="panel-head row-between"><h3>Model connections</h3>${btn('Add connection','connection','btn-small')}</header><div class="panel-body">${settings.connections.map(c=>`<div class="setting-row"><div><strong>${esc(c.name)}</strong><p>${esc(c.type)} · Configuration only</p><span class="mono muted" style="font-size:10px">Reference: ${esc(c.ref)}</span></div><span class="badge">Not verified</span></div>`).join('')}<div class="notice blue" style="margin-top:16px">Supported connection types depend on the integration. No live authentication or provider availability is demonstrated here. Secrets are never shown.</div><p class="muted" style="font-size:11px;margin-top:15px">Connections may be assigned to multiple agents. They do not merge identities, memory, or application accounts.</p></div></section><section class="panel"><header class="panel-head row-between"><h3>Local host</h3><span class="badge">Illustrative capacity</span></header><div class="panel-body capacity">${[['CPU allocation','2 / 8 cores',25],['Memory allocation','8 / 16 GB',50],['Persistent storage','48 / 256 GB',19]].map(([l,v,p])=>`<div><div class="row-between"><span>${l}</span><span class="mono">${v}</span></div><div class="progress"><span style="width:${p}%"></span></div></div>`).join('')}<div class="section-rule"><h3 style="font-size:17px">Workstations rest. Files stay.</h3><p class="muted" style="font-size:12px;margin:10px 0">Idle-stop is the default. Active work, managed background processes, and human takeover prevent idle-stop. A blocked run is not automatically idle.</p><p class="muted" style="font-size:12px">Work, schedules, or heartbeat can request wake-up within host capacity. Apps may need to relaunch or authenticate again.</p></div></div></section></div><section class="panel mt"><div class="panel-head"><h3>Installation & defaults</h3></div><div class="panel-body"><div class="setting-row"><div><strong>Local installation</strong><p>Single-user host · Linux workstations. Runtime installation and host compatibility are outside this prototype.</p></div><span class="badge">Not connected</span></div><div class="setting-row"><div><strong>Workstation default</strong><p>Illustrative resource preset. Adjust for each agent; these are not validated minimums.</p></div><span class="mono">1 core · 4 GB · 16 GB</span></div><div class="setting-row"><div><strong>Application credential references</strong><p>Configured per agent, separately from model connections. Never shared through workstation or procedure assignment.</p></div>${btn('Manage per agent','agents','btn-small')}</div></div></section>`}
function inbox(){openModal(`Needs you <span class="counter" style="display:inline-grid;vertical-align:middle">${attention.length}</span>`,`<p class="muted" style="margin-bottom:22px;font-size:13px">A few decisions that keep good work moving.</p>${attention.map(q=>`<article class="inbox-item"><div class="row-between"><span class="mono" style="color:${q.id==='review'?'var(--accent)':'var(--danger)'}">${q.type}</span><div class="row gap8">${avatar(q.agent,true)}<span class="mono">${getAgent(q.agent).name}</span></div></div><h3>${q.title}</h3><p>${q.text}</p><div class="row-between">${btn(q.id==='question'?'Answer question':q.id==='review'?'Review version':q.id==='unknown'?'Verify outcome':'Take over',q.id==='question'?'question':q.id==='review'?'review':q.id==='unknown'?'verify':'takeover','btn-small',`data-id="${q.agent}"`)}<button class="btn-link mono" style="font-size:10px" data-action="run" data-id="${q.run}">Run #${q.run} ↗</button></div></article>`).join('')||'<div class="empty">All clear. Your agents have what they need.</div>'}`,`<small>Every request has its own decision.</small>`,true)}
function question(){openModal('Two versions. Which should I use?',`<div class="row" style="margin-bottom:20px">${avatar('orin',true)}<span>Orin · Project archive <span class="mono muted">#103</span></span></div><p class="muted" style="font-size:13px;margin-bottom:20px">Both originals are untouched. Choose which copies belong in the working archive.</p><form id="question-form" class="form-grid"><label class="chip-check"><input name="decision" type="radio" value="Keep both versions, labelled by revision date." required checked>Keep both, labelled by revision date</label><label class="chip-check"><input name="decision" type="radio" value="Use the latest revision; keep the older original untouched.">Use the latest revision in the working archive</label><label>Additional direction<textarea name="direction" placeholder="Optional context for this run"></textarea></label></form><div class="notice blue mt">This answers run #103 only. It does not revise the procedure or grant new permissions.</div>`,`${btn('Not now','close')}<button form="question-form" class="btn btn-primary" type="submit">Send direction</button>`)}
function takeover(id){if(id&&agents.some(a=>a.id===id))selected=id;const a=getAgent();openModal(`Take over ${esc(a.name)}’s workstation`, `<div class="notice"><strong>You control. ${esc(a.name)} pauses.</strong>Private takeover stops agent actions, observation, and capture. This prototype demonstrates UI state only.</div><div class="stack mt"><div class="row">${icon('lock',24)}<div><strong>Private by default</strong><p class="muted" style="font-size:12px">The agent preview goes black. Teaching requires a separate, deliberate opt-in.</p></div></div><p class="muted" style="font-size:12px">For unsupported actions, take over before entering the signed-in application. No unrestricted shell or authenticated browser is presented as an enforceable automation boundary.</p></div>`,`${btn('Cancel','close')}${btn('Start private takeover','confirm-takeover','btn-primary')}`)}
function teachingPrompt(){openModal('Let the agent observe?',`<div class="notice blue"><strong>Teaching mode is an explicit opt-in.</strong>You keep control. Agent actions stay paused, but the demonstration becomes visible to the agent and may be recorded.</div><p class="muted mt" style="font-size:13px">Do not demonstrate private account details. Switching back to private mode stops observation and capture again.</p>`,`${btn('Stay private','close')}${btn('Enable teaching mode','confirm-teaching','btn-primary')}`)}
function handback(){const a=getAgent();openModal(`Return control to ${esc(a.name)}?`,`<div class="stack"><p>You are handing the workstation back explicitly.</p><div class="notice"><strong>Private does not mean erased.</strong>Files and signed-in sessions you leave on the workstation remain. The agent can inspect the permitted current state after handback.</div><p class="muted" style="font-size:13px">${esc(a.name)} will check current state before resuming supported steps. Unsupported actions still require human control. Procedure approval and action permissions stay unchanged.</p><label class="chip-check"><input id="handback-check" type="checkbox">I have left the workstation in a state I am ready to share.</label></div>`,`${btn('Keep control','close')}${btn('Return control to agent','confirm-handback','btn-primary')}`)}
function showRun(id){currentRun=id;const r=runs.find(x=>x.id===id);if(!r)return;const a=getAgent(r.agent);let details=r.id==='101'&&!r.reconciled?`<div class="notice"><strong>Outcome unknown · verify before retrying</strong>The session was interrupted after an external submission started. No reliable receipt was captured. Do not assume failure or submit again.</div><div class="mt">${btn('Verify destination outcome','verify','btn-primary')}</div><p class="muted" style="font-size:11px;margin-top:12px">This suspended run releases its agent slot. A verified retry queues behind Orin’s current work.</p>`:r.status==='Needs attention'?`<div class="notice"><strong>${r.detail}</strong>Supported local preparation may continue only after the blocker is resolved.</div><div class="row mt">${attention.some(q=>q.id==='question')?btn('Answer question','question','btn-primary'):''}${btn('Private takeover','takeover','','data-id="orin"')}</div>`:r.status==='Queued'?`<div class="notice blue"><strong>Waiting for ${a.name}’s active run</strong>${r.detail}. One active run per agent. Queue position is preserved.</div><div class="mt"><strong>Explicit helper handoff</strong><p class="muted" style="font-size:12px;margin-top:7px">Topic and selected source links only. Helpers work in their own queue and permissions. No desktop or SSH access is granted.</p>${btn('Inspect handoff','handoff','btn-small','style="margin-top:12px"')}</div>`:r.status==='Completed'?`<div class="notice blue"><strong>Completed with local evidence</strong>${r.id==='101'?'Outcome reconciled from your destination check.':'The draft and its source comparison were saved in this illustrative run.'}</div><div class="evidence"><div>${icon('file',18)}<strong>${r.id==='101'?'Destination verification note':'weekly-report-draft.md'}</strong><small>Local evidence · ${r.reconciled?'operator-confirmed':'illustrative file'}</small></div>${btn('Inspect','evidence','btn-small')}</div><div class="evidence"><div><strong>source-comparison.md</strong><small>Claim-to-source evidence</small></div>${btn('Inspect','sources-evidence','btn-small')}</div>`:r.status==='Failed'?`<div class="notice"><strong>Unreadable source · no output created</strong>The appendix file could not be parsed. Choose a readable source before queueing another attempt.</div><label class="mt">Replacement source reference<input id="replacement-source" placeholder="documents/appendix-readable.pdf"></label><div class="mt">${btn('Queue with new source','retry-failed','btn-primary')}</div>`:r.status==='Cancelled'?`<div class="notice blue"><strong>Cancelled by you</strong>No further actions will run. Its recorded history remains available.</div>`:`<div class="notice blue"><strong>${r.detail}</strong>Procedure: ${r.version}. Current execution remains pinned to this version.</div><div class="step done"><span class="step-num">✓</span><div><strong>Input scope recorded</strong><p>Selected sources only.</p></div></div><div class="step current"><span class="step-num">2</span><div><strong>${r.status==='Paused'?'Paused by you':'Working through the current step'}</strong><p>Local progress and evidence remain attached to this run.</p></div></div>`;
openModal(`Run #${r.id}`,`<div class="row-between" style="margin-bottom:15px"><h3>${esc(r.title)}</h3>${badge(r.status)}</div><div class="row muted" style="font-size:12px;margin-bottom:22px">${avatar(r.agent,true)}${a.name} · ${esc(r.schedule)}</div>${details}<div class="section-rule mt"><span class="eyebrow muted">Run record</span><div class="row-between" style="margin-top:12px;font-size:12px"><span>Procedure version</span><span class="mono" style="font-size:10px">${esc(r.version)}</span></div><div class="row-between" style="margin-top:10px;font-size:12px"><span>Workstation owner</span><span>${a.name} only</span></div><p class="muted" style="font-size:11px;margin-top:12px">Procedure activation does not change this run’s pinned instructions.</p></div>`,`${btn('Open agent','open-agent','',`data-id="${r.agent}"`)}<div class="row">${r.status==='Running'?btn('Pause run','pause-run','btn-small'):r.status==='Paused'&&r.id!=='101'?btn('Queue resume','resume-run','btn-small'):''}${['Running','Queued','Paused','Needs attention'].includes(r.status)?btn('Cancel run','cancel-run','btn-small'):''}</div>`)}
function verify(){openModal('Verify the interrupted submission',`<span class="eyebrow muted">Orin / Run #101</span><h3 style="margin:14px 0">Check the destination before any retry.</h3><p class="muted" style="font-size:13px;margin-bottom:20px">Inspect the destination in a private human-controlled session. Look for the archive handoff and its receipt. The prototype does not access that destination.</p><form id="verify-form" class="form-grid"><label class="chip-check"><input type="radio" name="outcome" value="confirmed" required>Confirmed: the handoff exists</label><label class="chip-check"><input type="radio" name="outcome" value="absent">Confirmed: it was not submitted</label><label class="chip-check"><input type="radio" name="outcome" value="unknown">I still cannot establish the outcome</label><label>Verification evidence<textarea name="evidence" required placeholder="Record what you checked: destination, receipt reference, or why the outcome is still unclear."></textarea></label></form><div class="notice blue mt">Recording an absent result does not retry automatically. A separate queue action follows; unsupported submission remains human-operated.</div>`,`${btn('Keep paused','close')}<button form="verify-form" class="btn btn-primary" type="submit">Record verification</button>`)}
function agentSettings(){const a=getAgent();openModal(`${esc(a.name)} / Agent settings`,`<form id="agent-settings-form" class="form-grid"><label>Instructions<textarea name="instructions">${esc(a.instructions)}</textarea></label><div class="grid-2"><label>Model connection<select name="model">${settings.connections.map(c=>`<option ${c.name===a.model?'selected':''}>${esc(c.name)}</option>`).join('')}</select><small>Applies to the next run. Identity and explicit saved memory stay with ${esc(a.name)}.</small></label><label>Idle behavior<select name="idle"><option ${a.idle==='Stop when idle'?'selected':''}>Stop when idle</option><option ${a.idle==='Always on'?'selected':''}>Always on</option></select><small>Active work and human control prevent idle-stop.</small></label></div><div class="section-rule"><h3>Action permissions</h3><p class="muted" style="font-size:12px;margin:9px 0 14px">Separate from procedure approval. Only narrowly supported execution paths may be automated.</p><div class="stack" style="gap:10px"><label class="chip-check"><input name="read" type="checkbox" ${a.read===false?'':'checked'}>Read selected source files</label><label class="chip-check"><input name="draft" type="checkbox" ${a.draft===false?'':'checked'}>Create local draft copies</label><label class="chip-check"><input type="checkbox" disabled>External upload / submission — human takeover</label></div><div class="notice mt">These are prototype permission selections, not verified enforcement. An unrestricted shell or signed-in browser is not offered as a bypass. Takeover starts before unsupported capabilities become available.</div></div><div class="section-rule"><h3>Collaboration</h3><label style="margin-top:14px">Who can help?<select id="collaboration" name="collab">${['Disabled','Approved collaborators only','Any agent in the installation'].map(s=>`<option ${a.collab===s?'selected':''}>${s}</option>`).join('')}</select></label><div id="collaborator-options" class="row wrap" style="margin-top:12px">${agents.filter(x=>x.id!==a.id).map(x=>`<label class="chip-check"><input name="helpers" type="checkbox" value="${x.id}" ${(a.helpers||['mira']).includes(x.id)?'checked':''}>${esc(x.name)}</label>`).join('')}</div><p class="muted" style="font-size:11px;margin-top:10px">Only explicit handoff contents travel. Helpers receive no desktop, SSH, credential, or additional action access.</p></div><div class="section-rule"><h3>Application credential references</h3><label style="margin-top:13px">Agent-private reference<input name="credential" value="${esc(a.credential||'agents/'+a.id+'/document-workspace')}" placeholder="A stored reference, never a secret"></label><small>Owner: ${esc(a.name)}. No secret values are displayed or collected.</small></div><div class="section-rule"><h3>Workstation & heartbeat</h3><div class="grid-2" style="margin-top:14px"><label>CPU cores · illustrative<input type="number" name="cpu" min="1" max="8" value="${a.cpu||1}" required></label><label>RAM (GB) · illustrative<input type="number" name="ram" min="1" max="16" value="${a.ram||4}" required></label></div><label class="chip-check" style="margin-top:14px"><input name="heartbeat" type="checkbox" ${a.heartbeat?'checked':''}>Check for approved work each morning</label><small>Heartbeat can run approved procedures within existing permissions; it cannot activate a draft or expand access.</small></div></form>`,`${btn('Cancel','close')}<button class="btn btn-primary" type="submit" form="agent-settings-form">Save agent settings</button>`);syncCollab()}
function syncCollab(){const mode=$('#collaboration');if(!mode)return;$('#collaborator-options').style.display=mode.value==='Approved collaborators only'?'flex':'none'}
function createFlow(){let body=`<div class="flow-steps">${['01 Identity','02 Connection','03 Workstation'].map((x,i)=>`<span class="${i===createStep?'active':''}">${x}</span>`).join('')}</div><form id="create-form" class="form-grid">`;
if(createStep===0)body+=`<div class="avatar-picker">${['mira','orin','kit'].map(id=>`<button type="button" class="avatar-choice ${(creation.look||'mira')===id?'selected':''}" data-action="choose-avatar" data-id="${id}" aria-label="Select ${id==='mira'?'coral orbit':id==='orin'?'cobalt aperture':'chartreuse monogram'} identity">${avatar(id)}</button>`).join('')}</div><label>Agent name<input name="name" required maxlength="28" placeholder="e.g. Ellis" value="${esc(creation.name||'')}"></label><label>Role<input name="role" required maxlength="55" placeholder="e.g. Research & documentation" value="${esc(creation.role||'')}"></label><label>Instructions<textarea name="instructions" required placeholder="What should this worker do? What should it always ask you about?">${esc(creation.instructions||'Keep source evidence traceable. Preserve originals. Ask when the next step is unclear.')}</textarea></label>`;
if(createStep===1)body+=`<h3>A connection, not an identity.</h3><p class="muted" style="font-size:13px">Assign a reusable model connection. Changing it later preserves the agent’s identity and explicit saved memory; behavior can vary across models.</p><label>Model connection<select name="model">${settings.connections.map(c=>`<option ${creation.model===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><div class="notice blue">Configured references only. Supported connection methods and execution features depend on the integration. Provider secrets are not placed on agent workstations.</div><small>Application accounts are configured separately, per agent, after creation.</small>`;
if(createStep===2)body+=`<h3>A workstation of their own.</h3><p class="muted" style="font-size:13px">Dedicated Linux workstation · owner: ${esc(creation.name)}. Other agents receive no desktop or SSH access.</p><div class="grid-2"><label>CPU cores<input name="cpu" type="number" min="1" max="8" value="${creation.cpu||1}" required></label><label>RAM · GB<input name="ram" type="number" min="1" max="16" value="${creation.ram||4}" required></label><label>Persistent storage · GB<input name="disk" type="number" min="8" max="256" value="${creation.disk||16}" required></label><label>Lifecycle<select name="idle"><option>Stop when idle</option><option ${creation.idle==='Always on'?'selected':''}>Always on</option></select></label></div><div class="notice blue"><strong>Illustrative resources, not validated requirements.</strong>Host headroom: 6 cores · 8 GB RAM · 208 GB storage. Capacity is checked before prototype provisioning.</div><p class="muted" style="font-size:12px">Stopped workstations retain disk state. Running work and human takeover prevent idle-stop. No runtime will actually be installed.</p>`;
body+='</form>';openModal('Create a digital worker',body,`${btn(createStep?'Back':'Cancel',createStep?'create-back':'close')}<button class="btn btn-primary" form="create-form" type="submit">${createStep===2?'Create agent':'Continue'} ${icon('arrow',15)}</button>`)}
function newWork(){openModal('Put something on the workbench',`<form id="new-work-form" class="form-grid"><label>What needs doing?<input name="title" required placeholder="e.g. Summarize the selected research notes"></label><label>Agent<select name="agent">${agents.map(a=>`<option value="${a.id}">${esc(a.name)} · ${a.state==='Idle'?'available':'queues behind current work'}</option>`).join('')}</select></label><label>Schedule<select name="schedule" id="work-schedule"><option>Next available slot</option><option>Tomorrow · 09:00</option><option>Every Monday · 09:00</option></select></label><label>Context handoff<textarea name="context" required placeholder="Explicit source references, intended output, and stopping points. No secrets."></textarea></label><div class="notice blue">One active run per agent. A recurring request still needs an approved procedure and the agent’s existing permissions before execution.</div></form>`,`${btn('Cancel','close')}<button form="new-work-form" class="btn btn-primary" type="submit">Queue work</button>`)}
function assign(id){const report=id==='report',title=report?procedure.title:id==='archive'?'Organize a project archive':'Source comparison brief';openModal('Assign a procedure',`<div class="row-between"><h3>${esc(title)}</h3><span class="badge">${report?'v'+activeVersion:'v1'} active</span></div><form id="assign-form" class="form-grid mt"><input type="hidden" name="procedure" value="${esc(title)}"><input type="hidden" name="version" value="${report?activeVersion:1}"><label>Assign to agent<select name="agent">${agents.map(a=>`<option value="${a.id}" ${a.id==='mira'?'selected':''}>${esc(a.name)} · ${a.state==='Idle'?'available':'queue after current run'}</option>`).join('')}</select></label><label>Variable input: reporting period or folder<input name="input" required placeholder="e.g. documents/project-archive"></label><div class="notice blue"><strong>Only the approved instructions travel.</strong>No credentials, private memory, workstation, or extra permissions are shared. The receiving agent uses its own accounts and access.</div><label class="chip-check"><input type="checkbox" name="privateShare" required>I confirm ${id==='sources'||report&&procedure.placement!=='Shared library'?'this private procedure may be shared as instructions with the selected agent':'the selected agent should receive these instructions'}.</label></form>`,`${btn('Cancel','close')}<button class="btn btn-primary" type="submit" form="assign-form">Assign & queue run</button>`)}
function connection(){openModal('Add a model connection',`<form id="connection-form" class="form-grid"><label>Connection name<input name="name" required maxlength="45" placeholder="e.g. Writing connection"></label><label>Supported connection type<select name="type"><option>API credential reference</option><option>Local endpoint</option><option>Subscription reference · adapter dependent</option></select></label><label>Stored configuration reference<input name="ref" required placeholder="model/writing-connection"></label><div class="notice blue">Enter a reference only, never a secret value. This adds local prototype configuration, without authenticating or checking provider support.</div></form>`,`${btn('Cancel','close')}<button class="btn btn-primary" form="connection-form" type="submit">Save reference</button>`)}
function saveProcedure(){const a=getAgent();openModal('Save what you taught',`<form id="save-procedure-form" class="form-grid"><label>Procedure title<input name="title" required value="${a.id==='mira'?'Weekly research digest':esc(procedure.title)}"></label><label>Placement<select name="placement"><option>Private · ${esc(a.name)}</option><option>Shared library</option></select></label><div class="notice blue"><strong>A draft, ready for your judgment.</strong>The next screen lets you edit variable inputs, fixed steps, rules, stop conditions, and completion evidence before you approve a version.</div><small>Saving does not activate a procedure, expand permissions, or unpin an existing run.</small></form>`,`${btn('Cancel','close')}<button class="btn btn-primary" form="save-procedure-form" type="submit">Create reviewable draft</button>`)}
function removeAttention(id){attention=attention.filter(q=>q.id!==id)}

function syncProcedure(){document.querySelectorAll('[data-procedure]').forEach(el=>procedure[el.dataset.procedure]=el.value);if($('#placement'))procedure.placement=$('#placement').value}

case 'wake':if(a.cpu>6||a.ram>8){toast('Not enough host capacity. Free resources or reduce the workstation preset.');break}a.station='Awake';render();toast('Workstation wake simulated. Applications may need to relaunch.');break;

case 'sources-evidence':openModal('Source-to-claim comparison',`<div class="stack"><h3>Evidence manifest</h3><p class="muted">Illustrative local record · not verified external research</p><div class="evidence"><span>Claim 01 · Original study</span><span class="badge">Source retained</span></div><div class="evidence"><span>Claim 02 · Source date mismatch</span><span class="badge">Excluded</span></div><p style="font-size:12px">Completion requires inspecting the output and evidence, not accepting the agent’s success message alone.</p></div>`,btn('Back to run','run','',`data-id="${currentRun}"`));break;

case 'resume-run':{const r=runs.find(x=>x.id===currentRun);r.status='Queued';r.detail='Awaiting state inspection before resumption';render();showRun(r.id);break}

case 'confirm-cancel':{const r=runs.find(x=>x.id===currentRun);r.status='Cancelled';r.detail='Cancelled by you';const owner=getAgent(r.agent);if(owner.run===r.id){owner.state='Idle';owner.task='Ready for the next useful thing';owner.note='No active run'}attention=attention.filter(q=>q.run!==r.id);closeModal();render();toast('Run cancelled. Recorded history retained.');break}
case 'retry-failed':{const source=$('#replacement-source').value.trim();if(!source){toast('Add a readable source reference first.');break}const r=runs.find(x=>x.id===currentRun);r.status='Queued';r.detail='Replacement source: '+source;r.schedule='Next available slot';closeModal();render();toast('Retry queued with the replacement source.');break}
case 'handoff':openModal('An explicit handoff, not shared access',`<span class="eyebrow muted">Mira → Kit</span><h3 class="mt">${helperCancelled?'Helper request cancelled':'Check the report structure'}</h3><div class="notice blue mt">${helperCancelled?'The parent run keeps its context. No helper work is queued.':'Explicit request waiting in the helper queue.'} Contents: topic, chosen source references, and the draft outline only.</div><p class="mt muted" style="font-size:13px">Kit uses its own workstation and permissions. The request waits in Kit’s queue; it cannot interrupt another active run.</p><div class="notice mt"><strong>If collaborators wait on each other</strong>The circular wait becomes a blocker. No agent gains access or bypasses a queue. You can cancel the helper request to break the cycle.</div>`,`${btn('Close','close')}${helperCancelled?'':btn('Cancel helper request','cancel-helper')}`);break;
case 'cancel-helper':helperCancelled=true;closeModal();toast('Helper request cancelled locally. The parent run keeps its own context.');break;

case 'choose-avatar':Object.assign(creation,Object.fromEntries(new FormData($('#create-form'))));creation.look=id;createFlow();break;
}
});

switch(form.id){

case 'verify-form':{const r=runs.find(x=>x.id==='101');r.verification=d.evidence;if(d.outcome==='confirmed'){r.status='Completed';r.reconciled=true;r.detail='Destination outcome confirmed by you';removeAttention('unknown');closeModal();render();toast('Outcome reconciled as completed. No retry performed.')}else if(d.outcome==='absent'){r.verifiedAbsent=true;r.detail='Verified absent · waiting for your retry decision';removeAttention('unknown');render();openModal('Verified absent. Choose the next step.',`<p>The destination check is recorded. No submission has been retried.</p><div class="notice blue mt">A recovery run will queue behind Orin’s active work. It can prepare the handoff; the unsupported submission remains a human takeover step.</div>`,`${btn('Leave paused','close')}${btn('Queue recovery preparation','queue-verified','btn-primary')}`)}else{r.status='Paused';r.detail='Outcome still unknown · retry blocked';closeModal();render();toast('Run remains paused. Retry is blocked until the outcome is established.')}break}
case 'agent-settings-form':a.instructions=d.instructions;a.model=d.model;a.idle=d.idle;a.collab=d.collab;a.helpers=new FormData(form).getAll('helpers');a.credential=d.credential;a.read=!!d.read;a.draft=!!d.draft;a.cpu=Number(d.cpu);a.ram=Number(d.ram);a.heartbeat=!!d.heartbeat;closeModal();render();toast('Settings saved locally. Model changes apply to later runs.');break;
case 'create-form':Object.assign(creation,d);if(createStep<2){createStep++;createFlow();break}{const c=creation;const shortage=Number(c.cpu)>6||Number(c.ram)>8||Number(c.disk)>208;if(shortage){toast('Host capacity shortage. Reduce resources: available 6 cores, 8 GB RAM, 208 GB disk.');break}const look=getAgent(c.look||'mira'),id='agent-'+Date.now();agents.push({...look,...c,id,look:c.look||'mira',state:'Idle',station:'Stopped',task:'Ready for the first conversation',progress:0,note:'New worker · no active run',control:'agent',run:'—',collab:'Approved collaborators only',helpers:[]});messages[id]=[];closeModal();goto('agents');render();toast(c.name+' created with a dedicated workstation in prototype state.');break}
case 'new-work-form':{const id=String(106+runs.length);runs.unshift({id,agent:d.agent,title:d.title,status:'Queued',schedule:d.schedule,detail:d.schedule.startsWith('Every')?'Recurring draft schedule · requires approved procedure before execution':'Waiting for agent slot and host capacity',version:'Ad hoc request',context:d.context});closeModal();workFilter='All work';goto('work');render();toast('Work queued. No external action has run.');break}
case 'assign-form':runs.unshift({id:String(106+runs.length),agent:d.agent,title:d.procedure,status:'Queued',schedule:'Next available slot',detail:'Input: '+d.input+' · instructions only',version:d.procedure+' · v'+d.version});closeModal();workFilter='Queued';goto('work');render();toast('Procedure assigned and queued. No credentials, memory, or access shared.');break;
case 'connection-form':if(settings.connections.some(c=>c.name.toLowerCase()===d.name.toLowerCase())){toast('Use a unique connection name.');break}settings.connections.push(d);closeModal();render();toast('Connection reference saved. Authentication has not been tested.');break;
case 'save-procedure-form':draftVersion=activeVersion+1;procedure.title=d.title;procedure.placement=d.placement;procedureDraft=true;reviewSource=selected;closeModal();goto('review');render();break;
}
});

let viewMode='chat',fleetFilter='All',fleetDensity='Comfortable',rosterQuery='';

let playback=!reducedMotion;

function connectionState(a){return a.control==='private'?'Observation blocked':a.control==='teaching'?'Teaching · observation on':a.station==='Disconnected'?'Disconnected':a.station==='Stopped'?'Stopped':a.state==='Running'?'Illustrative feed':'Connected · held'}

function caption(a){if(a.control==='private')return 'Private takeover. Agent actions, observation, and capture stopped.';if(a.control==='teaching')return 'You are demonstrating. Agent actions paused; observation explicitly enabled.';if(a.station==='Disconnected')return 'Feed unavailable. Recorded progress is retained; no actions are advancing.';if(a.station==='Stopped')return 'Idle-stopped. Disk state retained; no observation feed is running.';if(a.state!=='Running')return a.note;return actions[Math.floor((feedFrames[a.id]||0)/3)%actions.length]}
function feed(a){const frame=feedFrames[a.id]||0;let screen='';if(a.control==='private')screen=`<div class="feed-screen masked" data-private-mask="${a.id}"><div class="feed-placeholder"><div>${icon('lock',25)}<h3>Private control · eyes off</h3><p>You control this computer. Agent observation and capture are stopped.</p><span class="mono">No operator screen in this feed</span></div></div></div>`;
else if(a.station==='Stopped'||a.station==='Disconnected')screen=`<div class="feed-screen offline"><div class="recorded-desktop" aria-label="Illustrative frozen workstation frame"><div class="screen-window"><div class="screen-chrome">${a.name.toLowerCase()}-linux / last recorded frame</div><div class="screen-document"><h3>${a.station==='Stopped'?'Reporting procedure':'Source index'}</h3><div class="screen-rule"></div><div class="screen-rule" style="width:70%"></div><div class="screen-terminal">${a.station==='Stopped'?'draft saved · session ended':'index checkpoint retained'}<br>no actions advancing</div></div></div></div><div class="feed-placeholder"><div>${icon('computer',26)}<h3>${a.station==='Stopped'?'Workstation stopped':'Connection lost'}</h3><p>${a.station==='Stopped'?'Illustrative last frame · 08:32. Files retained; workstation is not running.':'Illustrative last frame only. Last contact 08:41; progress retained.'}</p><span class="mono">${a.name.toLowerCase()}-linux · ${a.station.toLowerCase()}</span></div></div></div>`;

return `${screen}<p class="feed-caption">${esc(caption(a))}</p><div class="feed-meta" style="margin-top:10px"><span>${esc(connectionState(a))} · ${feedAdvances(a)?'playback advancing':'feed held'}</span><span class="feed-time">${feedTime(a)}</span></div>`}

function workspace(){const a=getAgent();if(agentTab!=='Workspace')return legacyWorkspace();const t=document.createElement('template');t.innerHTML=legacyWorkspace();const chat=t.content.querySelector('.conversation');chat.querySelectorAll('.message').forEach(m=>{if(m.querySelector('.human-dot'))m.classList.add('human-message')});const msgs=chat.querySelector('.messages');if(a.id==='sable')msgs.innerHTML=`<div class="message human-message"><div><div class="message-author">You · 08:35</div><p>Index the selected source collection. Keep the original files intact.</p></div></div><div class="message">${avatar(a.id,true)}<div><div class="message-author">Sable · 08:41</div><p>The workstation connection was interrupted during indexing. My recorded progress is retained. Inspect the run before resuming.</p></div></div><div class="notice"><strong>Connection lost · run #106 paused</strong>No current observation feed or agent actions are advancing.</div>`;msgs.insertAdjacentHTML('afterbegin','<div class="chat-date">Today · supervised work session</div>');const firstAgent=msgs.querySelector('.message:not(.human-message)');if(firstAgent)firstAgent.insertAdjacentHTML('afterend',activityCard(a));else msgs.insertAdjacentHTML('beforeend',activityCard(a));return `<header class="chat-header" data-od-id="worker-conversation-header"><div class="row">${avatar(a.id,true)}<div><h1>${esc(a.name)}</h1><p>${esc(a.role)} · ${a.state.toLowerCase()}</p></div></div><div class="row gap8"><div class="mode-controls" aria-label="Workstation viewing mode">${['chat','split','workstation'].map(v=>`<button class="mode-button ${viewMode===v?'active':''}" data-action="view-mode" data-id="${v}" aria-pressed="${viewMode===v}">${v==='workstation'?icon('computer',14):''}${v==='split'?'Split view':v==='chat'?'Chat':'Workstation'}</button>`).join('')}</div><button class="icon-btn" data-action="agent-settings" aria-label="Worker settings">${icon('settings',17)}</button></div></header><div class="chat-tools"><button class="btn-link" data-action="agent-tab" data-id="Procedures">Procedures</button><button class="btn-link" data-action="agent-tab" data-id="Memory">Memory</button><button class="btn-link" data-action="save-procedure">Save procedure</button>${a.run!=='—'?`<button class="btn-link" data-action="run" data-id="${a.run}">Run #${a.run} ↗</button>`:''}<a href="#stations" class="btn-link" style="margin-left:auto;font-size:11px">All workstations ${icon('computer',14)}</a></div><div class="conversation-layout"><div class="chat-column">${chat.outerHTML}</div>${viewMode!=='chat'?workstationPane(a):''}</div>`}
function fleet(){const list=agents.filter(a=>fleetFilter==='All'||fleetFilter==='Working'&&a.state==='Running'&&a.control==='agent'||fleetFilter==='Needs attention'&&a.state==='Needs attention'||fleetFilter==='Stopped'&&a.station==='Stopped'||fleetFilter==='Disconnected'&&a.station==='Disconnected'||fleetFilter==='Private'&&a.control==='private');return `<header class="fleet-heading row-between wrap"><div><h1>All workstations</h1><p>A window into the work. Dedicated computers, one owner each.</p></div><span class="mono muted">ILLUSTRATIVE PLAYBACK</span></header><div class="fleet-toolbar"><div class="filters" style="margin:0">${['All','Working','Needs attention','Stopped','Disconnected','Private'].map(v=>`<button class="filter ${v===fleetFilter?'active':''}" data-action="fleet-filter" data-id="${v}">${v}</button>`).join('')}</div><label class="row gap8" style="font-size:10px">Density<select id="fleet-density" class="density-select"><option ${fleetDensity==='Comfortable'?'selected':''}>Comfortable</option><option ${fleetDensity==='Compact'?'selected':''}>Compact</option></select></label></div><section class="fleet-grid ${fleetDensity==='Compact'?'compact':''}" data-od-id="workstation-wall">${list.map(a=>`<button class="fleet-tile" data-action="open-feed" data-id="${a.id}" data-od-id="workstation-tile-${a.id}"><div class="feed-panel-title"><span class="row gap8">${avatar(a.id,true)}<strong>${esc(a.name)}</strong></span>${badge(a.state)}</div>${feedSlot(a,'fleet')}<div class="control-line" style="margin-top:12px">Owner: ${esc(a.name)} · Controller: ${esc(controller(a))}</div><p style="font-size:11px;color:var(--muted);margin-top:11px">${esc(a.task)} <span style="float:right">Open →</span></p></button>`).join('')||'<div class="empty">No workstations match this filter.</div>'}</section>`}
function roster(){return `<div class="roster-brand"><a href="#agents">BotOS<span>.</span></a><button class="icon-btn" data-action="create" aria-label="Create worker">${icon('plus',18)}</button></div><label><span style="position:absolute;clip-path:inset(50%)">Search workers</span><input id="worker-search" class="worker-search" placeholder="Search your workers…" value="${esc(rosterQuery)}"></label><a class="fleet-entry" href="#stations">${icon('computer',17)}All workstations<span class="mono muted" style="margin-left:auto">${agents.length}</span></a><div class="roster-heading"><span>YOUR WORKERS</span><button class="btn-link" style="font-size:10px;color:var(--muted)" data-action="create">+ New</button></div><div class="worker-list">${agents.map((a,i)=>`<a class="worker-link ${page==='workspace'&&a.id===selected?'selected':''}" href="#agent/${a.id}" data-worker-name="${esc((a.name+' '+a.role).toLowerCase())}" ${page==='workspace'&&a.id===selected?'aria-current="page"':''}><span>${avatar(a.id,true)}</span><div class="grow"><div class="row-between gap8"><span class="worker-name">${esc(a.name)}</span><time>${['09:14','09:09','08:32','08:41'][i]||'now'}</time></div><p class="worker-snippet">${esc(a.id==='mira'?'I’m tracing that claim to its source.':a.id==='orin'?'Two versions. Which should I keep?':a.id==='kit'?'Your procedure is ready to review.':a.note)}</p><div class="worker-state ${a.state==='Needs attention'?'attention':''}">${a.control==='private'?'Private takeover · you control':a.station==='Disconnected'?'Disconnected':a.state==='Idle'?'Idle · workstation stopped':a.state}</div></div></a>`).join('')}</div><nav aria-label="Studio navigation">${['work','library','settings'].map(n=>`<a href="#${n}" class="nav-item ${page===n?'active':''}">${icon(n,17)}${n[0].toUpperCase()+n.slice(1)}</a>`).join('')}</nav><div class="roster-bottom"><div class="row gap8"><span class="user">MX</span><div style="font-size:12px">Your workspace<br><small>Local host · prototype</small></div></div><button class="icon-btn" data-action="host" aria-label="Host settings">${icon('settings',16)}</button></div>`}
function render(){legacyRender();document.querySelector('.rail').innerHTML=roster();$('#content').className=page==='workspace'&&agentTab==='Workspace'?'messaging view-'+viewMode:'';if(page==='stations')$('#content').innerHTML=fleet();let bar=$('.topbar');if(!$('#preview-playback'))bar.querySelector('.row:last-child').insertAdjacentHTML('afterbegin',`<button id="preview-playback" class="playback-btn" data-action="playback"></button>`);$('#preview-playback').textContent=playback?'Ⅱ Pause preview':'▷ Preview playback';$('#preview-playback').setAttribute('aria-pressed',String(playback));if(!$('.roster-toggle'))bar.querySelector('.row').insertAdjacentHTML('afterbegin','<button class="icon-btn roster-toggle" data-action="roster-toggle" aria-label="Toggle worker roster">☰</button>');if($('#chat')&&chatDrafts[selected])$('#chat').value=chatDrafts[selected];filterRoster();decorate();}
function filterRoster(){document.querySelectorAll('[data-worker-name]').forEach(el=>el.hidden=!el.dataset.workerName.includes(rosterQuery.toLowerCase()))}
function refreshFeeds(){document.querySelectorAll('[data-feed]').forEach(el=>{const a=getAgent(el.dataset.feed);el.innerHTML=feed(a)})}
document.addEventListener('input',e=>{if(e.target.id==='chat'){chatDrafts[selected]=e.target.value}if(e.target.id==='worker-search'){rosterQuery=e.target.value;filterRoster()}});
document.addEventListener('change',e=>{if(e.target.id==='fleet-density'){fleetDensity=e.target.value;render()}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;switch(el.dataset.action){case 'view-mode':viewMode=el.dataset.id;render();break;case 'open-feed':selected=el.dataset.id;viewMode='split';agentTab='Workspace';goto('agent/'+selected);render();break;case 'fleet-filter':fleetFilter=el.dataset.id;render();break;case 'playback':playback=!playback;$('#preview-playback').textContent=playback?'Ⅱ Pause preview':'▷ Preview playback';$('#preview-playback').setAttribute('aria-pressed',String(playback));refreshFeeds();break;case 'roster-toggle':document.body.classList.toggle('roster-open');break;case 'operator-view':openModal('Operator view · private',`<div class="notice"><strong>Human-only desktop is unavailable in this prototype.</strong>No real workstation is connected. Agent and fleet previews remain masked; no private screen is generated or shared.</div><p class="muted mt">Use the separate teaching-mode decision only when you deliberately want the agent to observe.</p>`,btn('Keep private control','close'));break;case 'connection-help':openModal('Workstation disconnected',`<div class="notice"><strong>Sable’s feed is held at 08:41.</strong>No live reconnect is available in this local prototype. Inspect the recorded run before resuming; unknown external outcomes still require reconciliation.</div>`,`${btn('Close','close')}${btn('Inspect run #106','run','','data-id="106"')}`);break;}});
function advancePlayback(){if(!playback)return;for(const a of agents)if(feedAdvances(a))feedFrames[a.id]=(feedFrames[a.id]||0)+3;refreshFeeds()}
setInterval(advancePlayback,3000);

window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
