name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: make verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The gate is deliberately the same command a developer runs locally, so
      # the two cannot drift. Add new checks to scripts/verify.sh, not here.
      - name: Verify
        run: make verify
